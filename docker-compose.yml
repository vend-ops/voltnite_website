services:
  voltnite-website:
    build:
      context: .
      dockerfile: Dockerfile
    image: voltnite-website:latest
    container_name: voltnite-website
    restart: unless-stopped
    ports:
      # Expose on 127.0.0.1:3005 for local host testing
      - "127.0.0.1:3005:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - infra_vendops_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  infra_vendops_net:
    external: true

